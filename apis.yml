description: 'Rebellion Defense (rebelliondefense.com) is a defense-technology company
  building an AI-driven "intelligence shield" for protecting critical infrastructure
  and military assets — combining multi-band AESA radar sensing (ARGUS/SPECTRUM),
  AI track-fusion and threat prediction (PRISM), operator alerting and situational
  awareness (IRIS/STATUS), and effector command-and-control (HADES) on an integrated
  RBLN-OS platform. Recent public activity includes U.S. Navy contracts and
  designation as an awardable vendor on the CDAO Tradewinds Solutions Marketplace.
  The company publishes a marketing site only: as of this enrichment pass no public
  API, developer portal, SDKs, or machine-readable discovery surface is exposed.
  Added to the API Evangelist network as an Insight Partners portfolio lead.'
